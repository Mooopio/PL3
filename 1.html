/* ---------- EXPLANATION ---------- */
const EX=[
["1. Why programming languages evolve",`<p>A language is a <b>tool built for a job</b>. When hardware improves or a new kind of problem appears, a better-fitting tool is born. <i>Analogy:</i> a bread knife and a cleaver are both knives, but each is shaped by what it cuts.</p>
<ul><li><b>Historical context:</b> early languages were <mark>problem-specific</mark>: <mark>FORTRAN (1957)</mark> for scientific computing, <mark>COBOL (1959)</mark> for business data processing.</li>
<li><b>New needs:</b> hardware capabilities advanced → new application domains emerged → specific environment requirements.</li></ul>
<div class="tbl"><table><tr><th>Domain</th><th>Languages</th></tr><tr><td>Web development</td><td>JavaScript, PHP</td></tr><tr><td>Systems programming</td><td>C, Rust</td></tr><tr><td>Data science</td><td>Python, R</td></tr><tr><td>Concurrency</td><td>Go, Erlang</td></tr></table></div>
${tip("Slide quote: “As hardware capabilities advanced and new application domains emerged, the need for programming languages tailored to these evolving requirements became apparent.”")}`],
["2. Early problem-specific languages",`<div class="grid"><div><h3>FORTRAN (1957, IBM)</h3><p>FORmula TRANslation. The <mark>first widely used high-level language</mark>, built for scientific and mathematical computing.</p><ul><li>Lets programmers use <b>mathematical notation</b></li><li>Big efficiency gain for <b>numerical calculation</b></li><li>Cornerstone of <b>high-performance computing</b></li></ul></div>
<div><h3>COBOL (1959, Grace Hopper)</h3><p>Common Business-Oriented Language. The <mark>first business-oriented language</mark>, for business data processing and reporting.</p><ul><li><b>English-like syntax</b> makes programming accessible</li><li>Code is <b>self-documenting</b></li><li>Meets business data-processing needs</li></ul></div></div>
${tip("Take-away: these languages were designed with specific domains in mind, reflecting the computational needs of their era.")}`],
["3. Evolution driven by new needs",`<ul><li><b>Web:</b> the internet created demand for dynamic web content → <mark>JavaScript, PHP</mark></li>
<li><b>Data science:</b> explosion of data → sophisticated analysis and statistical computing → <mark>Python, R</mark></li>
<li><b>Systems:</b> efficient, close-to-hardware control for operating systems and low-level interaction → <mark>C, Rust</mark></li>
<li><b>Concurrency:</b> multi-core processors and distributed systems → <mark>Go, Erlang</mark></li></ul>
<p>Each new domain demanded languages with characteristics optimised for that task.</p>`],
["4. Language evolution timeline",`<div class="tbl"><table><tr><th>Era</th><th>Language</th><th>Domain</th><th>Key features</th></tr>
<tr><td rowspan=2>1950s</td><td>FORTRAN</td><td>Scientific computing</td><td>First high-level language, numerical efficiency</td></tr><tr><td>COBOL</td><td>Business reporting</td><td>English-like syntax, data processing</td></tr>
<tr><td rowspan=2>1970s</td><td>C</td><td>Systems programming</td><td>Efficiency, low-level access, structured programming</td></tr><tr><td>Smalltalk</td><td>Simulation, OOP</td><td>Pure object-oriented, GUI concepts</td></tr>
<tr><td rowspan=2>1990s</td><td>Java</td><td>Web, enterprise</td><td>“Write once, run anywhere”, platform independence</td></tr><tr><td>Python</td><td>General purpose</td><td>Readability, simplicity, extensive libraries</td></tr>
<tr><td rowspan=4>2010s</td><td>Rust</td><td>Systems programming</td><td>Memory safety, concurrency, performance</td></tr><tr><td>Go</td><td>Systems, cloud</td><td>Concurrency, simplicity, fast compilation</td></tr><tr><td>Kotlin</td><td>Android development</td><td></td></tr><tr><td>Swift</td><td>iOS / macOS development</td><td></td></tr></table></div>`],
["5. The five design goals",`<p>Language creation is deliberate: goals shape <b>syntax, semantics, and suitability</b> for tasks.</p>
<ul><li><mark>Readability:</mark> clarity for humans; clear syntax, intuitive naming, structured constructs; reduces cognitive load, helps collaboration.</li>
<li><mark>Reliability:</mark> fewer errors, predictable behaviour; strong typing, robust error handling, memory safety.</li>
<li><mark>Efficiency:</mark> effective use of computational resources; low-level control, native compilation, minimal runtime overhead.</li>
<li><mark>Portability:</mark> run with minimal changes across hardware/OS; standardised specifications, virtual machines, multi-architecture compilers.</li>
<li><mark>Expressiveness:</mark> conciseness for complex ideas; concise syntax, rich abstractions, fewer lines for the same functionality → productivity.</li></ul>
${tip("Mnemonic: <b>R</b>eal <b>E</b>ngineers <b>R</b>arely <b>P</b>anic <b>E</b>venly = Readability, Efficiency, Reliability, Portability, Expressiveness.")}
<p>Designers must <b>balance</b> these principles based on the intended use case.</p>`],
["6. Design trade-offs",`<p>It is usually impossible to maximise every quality, so designers prioritise by intended use.</p>
<p><b>A. Readability vs Performance (Python vs C).</b> Python: human-readable, indentation defines blocks, dynamic typing, interpreted; readability often costs performance. C: terse syntax, explicit memory management, low-level hardware control, compiles to native code; performance often costs readability.</p>
<p><b>B. Safety vs Flexibility (Rust vs C++).</b> Rust: strict ownership, borrow checker enforces memory safety at compile time, prevents null dereferences and data races; steeper learning curve. C++: immense flexibility and control, strong for performance-critical code; higher risk of memory errors, needs disciplined practice.</p>
<p><b>C. Simplicity vs Expressiveness (Go vs Scala).</b> Go: minimal features, easy to learn, clear syntax; more verbose. Scala: mixes OOP and FP, concise code, rich abstractions; steep learning curve.</p>
${tip("Simple languages are easier to learn but may require more code.")}`],
["7. The language design triangle",`<svg viewBox="0 0 420 270" width="100%" role="img" aria-label="Triangle with Safety, Simplicity and Performance corners"><polygon points="210,24 40,236 380,236" fill="none" stroke="var(--acc)" stroke-width="2"/><text x="210" y="16" text-anchor="middle">Safety (Rust)</text><text x="40" y="258" text-anchor="start">Simplicity (Go)</text><text x="380" y="258" text-anchor="end">Performance (C)</text><circle cx="210" cy="24" r="6" fill="var(--acc)"/><circle cx="40" cy="236" r="6" fill="var(--acc)"/><circle cx="380" cy="236" r="6" fill="var(--acc)"/></svg>
<ul><li><b>Safety:</b> prevents errors at compile time (Rust: strict memory rules).</li><li><b>Simplicity:</b> minimal features, easy to learn (Go: minimal syntax).</li><li><b>Performance:</b> optimised speed (C: close to hardware).</li></ul><p>Languages make deliberate trade-offs to serve their purpose.</p>`],
["8. Case studies",`<p><b>Python: readability first.</b> Indentation-based blocks, clear concise syntax, large library ecosystem, interpreted (line by line, dynamic typing), strong community, consistent syntax across versions. Quote: “Readability counts. Code is read much more often than it is written.” (PEP 20). Slide claim: Rust 10 lines, Go 8, C 6, Python fits the smallest footprint.</p>
<p><b>Rust: safety without sacrifice.</b> Core innovation: <mark>ownership model</mark>, enforced at compile time. No null dereferences (variables initialised before use), no data races (borrow checker), no double-frees (each value has one owner). Benefits: memory safety, <b>no garbage collector</b>, systems-level control. Cost: steep learning curve.</p>
<p><b>Go: simplicity and concurrency.</b> Developed at <b>Google</b> for scalable network services and distributed systems. Minimal syntax, fast compilation, <mark>goroutines and channels</mark>, fast execution. Used for network services/APIs, distributed systems, microservices.</p>
<p><b>JavaScript: the web’s lingua franca.</b> Early: prioritised simplicity and expressiveness for rapid web development, sacrificing strict safety and raw performance. Modern: <mark>JIT compilation (V8)</mark> boosted speed; safety addressed via <b>TypeScript</b> and external tools. Slide position: moved toward the Performance vertex while keeping Simplicity and Expressiveness.</p>
<p><b>Elixir: embracing concurrency.</b> Runs on the <mark>Erlang VM (BEAM)</mark>; built for concurrent, distributed, fault-tolerant systems. <b>“Let it crash”:</b> processes are isolated, so one failure does not take down the application. Nodes communicate by <b>message passing</b> (safe shared state). Lightweight processes give high throughput, better for <b>IO-bound</b> tasks.</p>`],
["9. Language comparison",`<div class="tbl"><table><tr><th>Language</th><th>Readability</th><th>Safety</th><th>Performance</th><th>Key characteristics</th></tr>
<tr><td>Python</td><td>High</td><td>Low</td><td>Lower</td><td>Clear syntax, large ecosystem, interpreted</td></tr>
<tr><td>Rust</td><td>Lower (steep curve)</td><td>High</td><td>High</td><td>Ownership gives memory safety without GC</td></tr>
<tr><td>Go</td><td>High</td><td>Medium</td><td>High</td><td>Simple syntax, built-in concurrency, fast compile</td></tr>
<tr><td>JavaScript</td><td>Medium-high</td><td>Low (TypeScript helps)</td><td>Improved by JIT</td><td>Simplicity and expressiveness</td></tr>
<tr><td>Elixir</td><td>n/a on slides</td><td>Fault tolerance</td><td>High throughput</td><td>BEAM, concurrent, distributed</td></tr></table></div>
${tip("The slide’s rating icons are not in the text, so ratings are inferred from its Key Insights. Python: readability over safety. Rust: safety and performance over immediate readability. Go: simplicity, readability, and performance balanced.")}`]
];

["Short","Why do new programming languages emerge?","Languages emerge to meet new technological advances and domain-specific needs. As hardware improved and new application domains appeared (web, data science, systems, concurrency), earlier languages no longer fitted well. Early languages were problem-specific: FORTRAN (1957) for science, COBOL (1959) for business. Later examples are JavaScript/PHP for the web, Python/R for data, C/Rust for systems and Go/Erlang for concurrency."],

["Short","Explain the readability vs performance trade-off with Python and C.","Python uses clear syntax, indentation blocks, dynamic typing and interpretation, so it is readable but slower. C is terse, uses explicit memory management and compiles to native code, so it is fast but harder to read. Each gains one quality at the other’s expense."],
["Short","What is Rust’s ownership model and why does it matter?","Ownership gives each value a single owner responsible for its memory, and the borrow checker enforces access rules at compile time. It prevents null dereferences, data races and double-frees with no garbage collector and no runtime overhead. The cost is a steep learning curve."],
["Short","Explain Elixir’s “let it crash” philosophy.","Elixir runs on the Erlang VM with isolated lightweight processes. When one process fails, the failure does not crash the application, giving fault tolerance. Processes communicate by message passing, which suits distributed, IO-bound systems."],
["Long","Explain the language design triangle and place Python, Rust and Go on it.","The triangle’s corners are <b>Safety</b> (errors prevented at compile time), <b>Simplicity</b> (minimal features, easy to learn) and <b>Performance</b> (fast execution). A language cannot sit at all three corners, so each makes a deliberate trade-off for its purpose. <b>Python</b> leans to Simplicity and readability, sacrificing safety and speed. <b>Rust</b> sits near Safety with strong Performance, paying with a steeper learning curve. <b>Go</b> sits near Simplicity with good Performance and built-in concurrency, with more verbose code and fewer abstractions. C marks the Performance corner. The lesson: placement follows intended use."],

<div><h3>Rust</h3><ul><li>Ownership, borrow checker, compile-time</li><li>No null, no data races, no double-free, no GC</li><li>Steep curve</li></ul></div>
<div><h3>Go · JS · Elixir</h3><ul><li>Go: Google, goroutines, channels, fast compile, verbose</li><li>JS: V8 JIT, TypeScript</li><li>Elixir: BEAM, let it crash, message passing, IO-bound</li></ul></div>
</div>

/* ---------- RENDER ---------- */
const bar=(id)=>`<div class="bar"><button class="tool" data-all="${id}:1">Expand all</button><button class="tool" data-all="${id}:0">Collapse all</button></div>`;
$("#s0").innerHTML=bar("s0")+EX.map((e,i)=>det(e[0],e[1],i==0)).join("");
$("#s1").innerHTML=bar("s1")+SUM.map((e,i)=>det(e[0],e[1],true)).join("");
$("#s3").innerHTML=W.map(w=>det(`<span>${w[1]} <span class="lv">(${w[0]})</span></span>`,`<p>${w[2]}</p>`)).join("");
$("#s4").innerHTML=REV;
let score=0,done=0;
$("#s2").innerHTML=`<div class="bar"><button class="tool" id="rs">Reset</button><span class="sc" id="sc"></span></div>`+Q.map((q,i)=>`<div class="q" data-i="${i}"><p>${i+1}. ${q[1]} <span class="lv">${q[0]}</span></p>${q[2].map((o,j)=>`<button class="o" data-j="${j}">${o}</button>`).join("")}<div class="ex"></div></div>`).join("");
const upd=()=>$("#sc").textContent=`Score ${score}/${done} (of ${Q.length})`;
function rst(){score=0;done=0;document.querySelectorAll(".q").forEach(q=>{q.classList.remove("done");q.querySelectorAll(".o").forEach(o=>o.className="o")});upd()}
$("#rs").onclick=rst;upd();
document.querySelectorAll(".q").forEach(el=>{const q=Q[el.dataset.i];el.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
 if(el.classList.contains("done"))return;const j=+b.dataset.j;done++;if(j==q[3])score++;
 el.querySelectorAll(".o").forEach(o=>{if(+o.dataset.j==q[3])o.classList.add("ok")});if(j!=q[3])b.classList.add("no");
 el.querySelector(".ex").innerHTML=(j==q[3]?"<b>Correct.</b> ":"<b>Not quite.</b> ")+q[4];el.classList.add("done");upd()})});
document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const [id,v]=b.dataset.all.split(":");document.querySelectorAll("#"+id+" details").forEach(d=>d.open=v=="1")});
const nav=$("#nav");
tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>show(i);nav.appendChild(b)});
function show(i){nav.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k==i));for(let k=0;k<5;k++)$("#s"+k).classList.toggle("on",k==i);try{location.hash="t"+i}catch(e){}}
const h=parseInt((location.hash||"").replace("#t",""));show(h>=0&&h<5?h:0);
$("#th").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
</script>
